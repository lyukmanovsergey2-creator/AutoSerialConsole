name: Build APK

# Прямая сборка APK на раннере GitHub (без сторонних Docker-действий).
# Запускается при пуше в main и вручную (Actions -> Run workflow).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Buildozer (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Cache Buildozer / SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # Целевой Python 3.11 (через p4a.branch=2024.01.21) + Kivy 2.3.0 ->
          # готовые .c Kivy собираются с Cython 0.29.33
          pip install "cython==0.29.33" buildozer

      - name: Build debug APK
        run: |
          set -o pipefail
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoSerialConsole-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Report failure details
        if: failure()
        run: |
          # buildozer при падении печатает большой блок ENVIRONMENT, а реальная
          # ошибка и строка "# Command failed:" идут ПЕРЕД ним. Вырезаем дамп.
          ln=$(grep -n "ENVIRONMENT:" build.log 2>/dev/null | tail -1 | cut -d: -f1)
          if [ -n "$ln" ]; then
            head -n "$ln" build.log | tail -n 70 > /tmp/err.txt
          else
            tail -n 70 build.log > /tmp/err.txt 2>/dev/null || true
          fi
          echo "### Сборка упала (фрагмент перед ENVIRONMENT)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/err.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # в аннотации (единственный читаемый отсюда канал)
          while IFS= read -r line; do
            [ -n "$line" ] && printf '::error::%s\n' "${line:0:600}"
          done < /tmp/err.txt || true
