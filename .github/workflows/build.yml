name: Build APK

# Прямая сборка APK на раннере GitHub (без сторонних Docker-действий).
# Запускается при пуше в main/master и fix/*, для pull request и вручную
# (Actions -> Run workflow).

on:
  push:
    branches: [ main, master, 'fix/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  # Быстрая проверка синтаксиса и логики — без Android SDK.
  # Ловит ошибки до долгой сборки и блокирует build при падении.
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyflakes

      - name: Compile check
        run: python -m py_compile main.py serial_core.py tests/test_serial_core.py tests/test_main_smoke.py

      - name: Pyflakes
        run: python -m pyflakes main.py serial_core.py tests/test_serial_core.py tests/test_main_smoke.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  build:
    name: Buildozer (APK)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Cache Buildozer / SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # Целевой Python 3.11 (через p4a.branch=v2024.01.21) + Kivy 2.3.0.
          # buildozer 1.5.0 — ровесник этого p4a (их аргументы apk совместимы);
          # более новый buildozer передаёт флаги, которых старый p4a не знает.
          pip install "cython==0.29.33" "buildozer==1.5.0"

      - name: Build APK
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
          # НЕ используем "yes |" (даёт SIGPIPE/141 после успеха) — лицензии
          # принимаются через android.accept_sdk_license=True. Берём РЕАЛЬНЫЙ
          # код возврата buildozer через PIPESTATUS, а не tee.
          # Сначала пробуем release-сборку (не debuggable). Если gradle/p4a
          # на ней спотыкается — откатываемся на проверенную debug-сборку;
          # подпись всё равно накладывается отдельным шагом ниже.
          set +e
          buildozer -v android release 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::warning title=Release build failed::Собираю debug APK как запасной вариант"
            buildozer -v android debug 2>&1 | tee -a build.log
            code=${PIPESTATUS[0]}
          fi
          echo "buildozer exit code: $code"
          exit $code

      # Подписываем APK постоянным ключом, чтобы обновления ставились поверх
      # установленной версии. Ключ хранится в секретах репозитория.
      - name: Sign APK
        if: success()
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # GitHub запускает шаг через bash -e; отключаем автоаварию, чтобы
          # ошибки попадали в наш лог и превращались в понятные аннотации,
          # а не в молчаливый "exit code 2".
          set +e
          # Подробный вывод шага уходит в файл: при ошибке хвост печатается
          # аннотациями, чтобы причину было видно без скачивания логов.
          LOG="$RUNNER_TEMP/sign.log"
          : > "$LOG"
          exec 3>&1
          exec >>"$LOG" 2>&1

          warn() { printf '::warning title=Signature::%s\n' "$1" >&3; }
          die() {
            printf '::error title=Sign APK::%s\n' "$1" >&3
            tail -n 25 "$LOG" 2>/dev/null | while IFS= read -r line; do
              [ -n "$line" ] && printf '::error::%s\n' "${line:0:900}" >&3
            done
            exit 1
          }

          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

          # Ищем build-tools в кэше Buildozer (путь может отличаться от версии к версии).
          BT=""
          for cand in "$HOME"/.buildozer/android/platform/android-sdk/build-tools/*/; do
            [ -x "${cand}apksigner" ] && BT="${cand%/}"
          done
          if [ -z "$BT" ]; then
            found=$(find "$HOME/.buildozer" -type f -name apksigner -print -quit 2>/dev/null)
            if [ -n "$found" ]; then BT=$(dirname "$found"); fi
          fi
          [ -n "$BT" ] || die "Не найден apksigner (Android build-tools) в ~/.buildozer"
          echo "build-tools: $BT"
          ls "$BT" | head -40

          echo "cwd: $(pwd)"
          echo "--- bin ---"
          ls -la bin 2>&1 | head -30
          echo "--- найденные APK ---"
          find bin .buildozer -name '*.apk' -printf '%TY-%Tm-%Td %TH:%TM %p\n' 2>/dev/null | sort | tail -10

          # Buildozer кладёт debug-APK в bin/, а release может оказаться глубже
          # в .buildozer — берём самый свежий APK из обоих мест.
          APK=$(find bin .buildozer -name '*.apk' -printf '%T@\t%p\n' 2>/dev/null \
                | sort -nr | awk -F'\t' 'NR==1{print $2}')
          [ -n "$APK" ] || die "APK не найден ни в bin/, ни в .buildozer/"
          echo "Исходный APK: $APK"

          ALIAS="${KEY_ALIAS:-autoserial}"
          [ -n "${KEY_PASS:-}" ] || KEY_PASS="${KS_PASS:-}"

          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore" \
              || die "Не удалось декодировать keystore из секрета ANDROID_KEYSTORE_BASE64"
            echo "Подпись: постоянный ключ из секретов."
            STABLE=1
          else
            warn "Секрет ANDROID_KEYSTORE_BASE64 не задан: подписываю временным ключом. Обновление поверх установленной версии не встанет."
            KS_PASS="${KS_PASS:-ephemeral}"
            KEY_PASS="${KEY_PASS:-ephemeral}"
            openssl req -x509 -newkey rsa:2048 -days 10000 -nodes \
              -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" \
              -subj "/CN=AutoSerialConsole" || die "openssl: не удалось создать сертификат"
            openssl pkcs12 -export -in "$RUNNER_TEMP/cert.pem" \
              -inkey "$RUNNER_TEMP/key.pem" -name "$ALIAS" \
              -out "$RUNNER_TEMP/release.keystore" \
              -passout "pass:$KS_PASS" || die "openssl: не удалось создать keystore"
            STABLE=0
          fi

          VERSION=$(awk -F= '/^version[[:space:]]*=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' buildozer.spec)
          [ -n "$VERSION" ] || VERSION="unknown"
          OUT="dist/AutoSerialConsole-$VERSION.apk"
          mkdir -p dist

          # Убираем старую (debug) подпись, выравниваем и подписываем заново.
          cp "$APK" "$RUNNER_TEMP/app-unsigned.apk" || die "Не удалось скопировать APK"
          zip -q -d "$RUNNER_TEMP/app-unsigned.apk" \
            'META-INF/*.RSA' 'META-INF/*.SF' 'META-INF/*.MF' || true
          "$BT/zipalign" -f -p 4 "$RUNNER_TEMP/app-unsigned.apk" \
            "$RUNNER_TEMP/app-aligned.apk" || die "zipalign не смог выровнять APK"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$OUT" "$RUNNER_TEMP/app-aligned.apk" \
            || die "apksigner не смог подписать APK"
          "$BT/apksigner" verify --print-certs "$OUT" || die "Подпись не прошла проверку apksigner verify"
          ls -l "$OUT"

          printf 'APK подписан: `%s` (version `%s`, ключ: %s)\n' "$OUT" "$VERSION" \
            "$([ "$STABLE" = "1" ] && echo постоянный || echo временный)" >&3
          {
            echo "### APK подписан"
            echo ""
            echo "- файл: \`$OUT\`"
            echo "- version: \`$VERSION\`"
            if [ "$STABLE" = "1" ]; then
              echo "- ключ: постоянный (из секретов) — обновления ставятся поверх"
            else
              echo "- ключ: **временный** (секреты не заданы) — перед установкой удалите старую версию"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoSerialConsole-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Report failure details
        if: failure()
        run: |
          # 1) убрать ANSI-коды; 2) выкинуть служебные строки buildozer и
          # ENVIRONMENT-дамп (они начинаются с '#'); 3) показать хвост — там
          # настоящая ошибка (gradle / компилятор / p4a).
          if [ -f "$RUNNER_TEMP/sign.log" ]; then
            echo "### Лог подписи" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 "$RUNNER_TEMP/sign.log" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 "$RUNNER_TEMP/sign.log" 2>/dev/null | while IFS= read -r l; do
              [ -n "$l" ] && printf '::error::S %s\n' "${l:0:800}"
            done || true
          fi
          sed -r 's/\x1b\[[0-9;?]*[mK]//g' build.log > /tmp/clean.log 2>/dev/null || cp build.log /tmp/clean.log
          grep -vE '^[[:space:]]*#' /tmp/clean.log > /tmp/noenv.log 2>/dev/null || cp /tmp/clean.log /tmp/noenv.log
          echo "### Хвост лога (без служебных строк)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 /tmp/noenv.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # argparse-ошибка p4a (unrecognized/invalid) — самое важное
          grep -niE "unrecognized arguments|: error:|invalid choice|apk: error|p4a: error|the following arguments" /tmp/clean.log 2>/dev/null \
            | tail -n 4 | while IFS= read -r line; do printf '::error::E %s\n' "${line:0:600}"; done || true
          # строка вызова p4a apk (чтобы увидеть переданные флаги)
          grep -niE "toolchain\.py apk| apk .*--|pythonforandroid.*apk|/p4a.* apk" /tmp/clean.log 2>/dev/null \
            | tail -n 2 | while IFS= read -r line; do printf '::error::C %s\n' "${line:0:600}"; done || true
          tail -n 4 /tmp/noenv.log | while IFS= read -r line; do
            [ -n "$line" ] && printf '::error::T %s\n' "${line:0:550}"
          done || true
