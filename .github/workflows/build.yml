name: Build APK

# Прямая сборка APK на раннере GitHub (без сторонних Docker-действий).
# Запускается при пуше в main и вручную (Actions -> Run workflow).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Buildozer (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Cache Buildozer / SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # Целевой Python 3.11 (через p4a.branch=2024.01.21) + Kivy 2.3.0 ->
          # готовые .c Kivy собираются с Cython 0.29.33
          pip install "cython==0.29.33" buildozer

      - name: Build debug APK
        run: |
          set -o pipefail
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoSerialConsole-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Report failure details
        if: failure()
        run: |
          # 1) убрать ANSI-коды; 2) выкинуть служебные строки buildozer и
          # ENVIRONMENT-дамп (они начинаются с '#'); 3) показать хвост — там
          # настоящая ошибка (gradle / компилятор / p4a).
          sed -r 's/\x1b\[[0-9;?]*[mK]//g' build.log > /tmp/clean.log 2>/dev/null || cp build.log /tmp/clean.log
          grep -vE '^[[:space:]]*#' /tmp/clean.log > /tmp/noenv.log 2>/dev/null || cp /tmp/clean.log /tmp/noenv.log
          echo "### Хвост лога (без служебных строк)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 /tmp/noenv.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # приоритет — строки с явными маркерами ошибок (исключая имена .py)
          grep -nEi 'traceback|error:|exception|aborting|returned non-zero|FAILURE:|what went wrong|BUILD FAILED|task .*FAILED|no such file|cannot find|undefined reference|fatal error|ld:' /tmp/noenv.log 2>/dev/null \
            | grep -vEi 'errors?\.py|exceptions?\.py|_exceptions|/test_|\.pyc' | tail -n 20 \
            | while IFS= read -r line; do printf '::error::%s\n' "${line:0:600}"; done || true
          # и просто последние строки
          tail -n 20 /tmp/noenv.log | while IFS= read -r line; do
            [ -n "$line" ] && printf '::error::TAIL %s\n' "${line:0:550}"
          done || true
